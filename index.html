<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOON STORES | Super App Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --p: #ff4500; --bg: #0b0b0b; --card: #161616; --white: #ffffff; --gray: #888; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--white); padding-bottom: 90px; overflow-x: hidden; }
        
        /* Announcement Bar */
        .anno-bar { background: gold; color: #000; font-size: 0.8rem; font-weight: bold; text-align: center; padding: 5px; overflow: hidden; white-space: nowrap; }
        .anno-text { display: inline-block; animation: scroll-text 15s linear infinite; }
        @keyframes scroll-text { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

        /* Timer & UI */
        .timer-box { font-size: 0.7rem; color: #ffeb3b; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 5px; margin-top: 5px; display: inline-block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card { background: var(--card); border-radius: 18px; padding: 12px; border: 1px solid #222; position: relative; }
        .card img { width: 100%; height: 130px; object-fit: contain; }

        /* Floating WA */
        .wa-float { position: fixed; bottom: 100px; right: 20px; background: #25d366; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; z-index: 4000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* Spin Wheel */
        .wheel-btn { background: linear-gradient(45deg, #ff4500, #ff8c00); color: white; border: none; padding: 10px 20px; border-radius: 20px; margin: 15px; width: calc(100% - 30px); font-weight: bold; }

        /* Admin & Panels */
        .panel { position: fixed; inset: 0; background: #000; z-index: 6000; display: none; overflow-y: auto; padding: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #333; color: #fff; border-radius: 8px; }
        .btn-p { background: var(--p); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        /* Nav */
        .nav { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #333; z-index: 5000; }
        .nav i { font-size: 1.2rem; color: var(--gray); }
        .nav .active { color: var(--p); }

        /* Status Colors */
        .st-delivered { color: #2ecc71 !important; }
        .st-cancelled { color: #e74c3c !important; }
        .st-return { color: #f1c40f !important; }
    </style>
</head>
<body>

    <div id="maintenance-ui" class="panel" style="display:none; text-align:center; justify-content:center; flex-direction:column;">
        <h1>🚧 MOON STORES</h1>
        <p>We are updating for better experience. Back in a bit!</p>
    </div>

    <div class="anno-bar"><div class="anno-text" id="anno-msg">Special Offer: Buy 1 Get 1 Free on all Spicy Sauces! Use Moon Coins to get 50% Off.</div></div>

    <div id="app">
        <div style="padding:15px; display:flex; justify-content:space-between; align-items:center;">
            <h2 style="color:var(--p)">MOON STORES</h2>
            <div onclick="startVoiceSearch()"><i class="fas fa-microphone" style="font-size:1.5rem; color:var(--p)"></i></div>
        </div>

        <button class="wheel-btn" onclick="spinWheel()">🎡 SPIN & WIN MOON COINS</button>

        <div class="grid" id="prod-grid"></div>

        <div style="padding:15px;">
            <h3>Track Your Orders</h3>
            <div id="user-tracking-list"></div>
        </div>

        <div style="padding:30px; text-align:center; font-size:0.7rem; color:#222;">
            Terms & Conditions <span id="secret-trigger" onclick="handleSecret()">rexhzo</span>
        </div>
    </div>

    <div id="panel-admin" class="panel">
        <h2 style="color:var(--p)">MASTER ADMIN</h2>
        <div style="background:#111; padding:15px; border-radius:15px; margin-bottom:15px;">
            <h4>Announcement Text</h4>
            <input type="text" id="adm-anno" placeholder="Type message...">
            <button class="btn-p" onclick="updateAnno()">UPDATE BANNER</button>
        </div>
        <div style="background:#111; padding:15px; border-radius:15px; margin-bottom:15px;">
            <h4>Manage Orders (Status)</h4>
            <div id="adm-orders-list"></div>
        </div>
        <div style="background:#111; padding:15px; border-radius:15px; margin-bottom:15px;">
            <h4>Maintenance Mode</h4>
            <button class="btn-p" style="background:red;" onclick="toggleMaintenance(true)">ON</button>
            <button class="btn-p" style="background:green;" onclick="toggleMaintenance(false)">OFF</button>
        </div>
        <button class="btn-p" style="background:#333;" onclick="closeAdmin()">CLOSE</button>
    </div>

    <a href="https://wa.me/917217299458" class="wa-float"><i class="fab fa-whatsapp"></i></a>

    <nav class="nav">
        <i class="fas fa-home active"></i>
        <i class="fas fa-search" onclick="Swal.fire('Search','Type to find products','info')"></i>
        <i class="fas fa-coins" onclick="Swal.fire('Moon Coins','Balance: 500','success')"></i>
        <i class="fas fa-shopping-bag" onclick="Swal.fire('Cart','Your items are ready','success')"></i>
    </nav>

    <script>
        const ADMIN_WA = "917217299458";
        let clicks = 0;
        let db = {
            prods: JSON.parse(localStorage.getItem('mega_p')) || [
                {name:"Ghost Pepper Kit", price:999, img:"https://i.ibb.co/h7VvN1p/1000151644.jpg", time:"02:45:10"},
                {name:"Moon Spicy Special", price:499, img:"https://i.ibb.co/LST6PhY/1000151664.jpg", time:"01:20:05"}
            ],
            orders: JSON.parse(localStorage.getItem('mega_o')) || [],
            maint: localStorage.getItem('mega_m') === 'true'
        };

        function render() {
            if(db.maint) { document.getElementById('maintenance-ui').style.display = 'flex'; return; }
            
            document.getElementById('prod-grid').innerHTML = db.prods.map(p => `
                <div class="card">
                    <img src="${p.img}">
                    <p style="font-size:0.8rem; margin-top:5px;">${p.name}</p>
                    <b style="color:var(--p)">₹${p.price}</b><br>
                    <div class="timer-box"><i class="fas fa-bolt"></i> ${p.time}</div>
                    <button class="btn-p" style="padding:8px; font-size:0.7rem;" onclick="placeOrder('${p.name}', ${p.price})">ORDER NOW</button>
                </div>
            `).join('');

            renderTracking();
        }

        function placeOrder(name, price) {
            vibrate();
            Swal.fire({ title: 'Delivery Address', input: 'text', confirmButtonText: 'Order' }).then(res => {
                if(res.value) {
                    const oid = "MS-" + Math.floor(Math.random()*9999);
                    const order = {id:oid, item:name, price, status:'Ordered', addr:res.value, color:'#888'};
                    db.orders.push(order);
                    save();
                    confetti();
                    window.open(`https://wa.me/${ADMIN_WA}?text=ORDER!%0AID: ${oid}%0AItem: ${name}%0AAddress: ${res.value}`);
                    Swal.fire('Success', 'Order Placed & WhatsApp Sent!', 'success');
                    render();
                }
            });
        }

        function spinWheel() {
            vibrate();
            Swal.fire({ title: 'Spinning...', timer: 2000, didOpen: () => Swal.showLoading() }).then(() => {
                const win = [10, 50, 100, 20, 5][Math.floor(Math.random()*5)];
                Swal.fire('Congrats!', `You won ${win} Moon Coins!`, 'success');
            });
        }

        function startVoiceSearch() {
            vibrate();
            Swal.fire('Voice Search', 'Listening...', 'info');
        }

        function handleSecret() {
            clicks++;
            if(clicks === 6) { clicks=0; document.getElementById('panel-admin').style.display='block'; renderAdmin(); }
        }

        function renderAdmin() {
            document.getElementById('adm-orders-list').innerHTML = db.orders.map(o => `
                <div style="padding:10px 0; border-bottom:1px solid #333;">
                    ${o.id} - ${o.item}<br>
                    <select onchange="updateStatus('${o.id}', this.value)" style="width:auto;">
                        <option value="">Set Status</option>
                        <option value="Delivered">Green (Delivered)</option>
                        <option value="Return">Yellow (Return)</option>
                        <option value="Cancelled">Red (Cancel)</option>
                    </select>
                </div>
            `).join('');
        }

        function updateStatus(id, stat) {
            let o = db.orders.find(x => x.id === id);
            o.status = stat;
            if(stat==='Delivered') o.color = '#2ecc71';
            else if(stat==='Return') o.color = '#f1c40f';
            else if(stat==='Cancelled') o.color = '#e74c3c';
            save(); render();
        }

        function renderTracking() {
            document.getElementById('user-tracking-list').innerHTML = db.orders.map(o => `
                <div style="background:var(--card); padding:10px; border-radius:10px; margin-top:10px; border-left: 5px solid ${o.color}">
                    <b>${o.item}</b> <span style="float:right; color:${o.color}">${o.status}</span><br>
                    <small>Tracking ID: ${o.id}</small>
                </div>
            `).join('');
        }

        function updateAnno() {
            const msg = document.getElementById('adm-anno').value;
            document.getElementById('anno-msg').innerText = msg;
            Swal.fire('Done', 'Banner Updated!', 'success');
        }

        function toggleMaintenance(val) {
            db.maint = val;
            localStorage.setItem('mega_m', val);
            location.reload();
        }

        function vibrate() { if(navigator.vibrate) navigator.vibrate(50); }
        function save() {
            localStorage.setItem('mega_p', JSON.stringify(db.prods));
            localStorage.setItem('mega_o', JSON.stringify(db.orders));
        }
        function closeAdmin() { document.getElementById('panel-admin').style.display='none'; }

        window.onload = render;
    </script>
</body>
</html>
